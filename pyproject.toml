[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "the-haruspis-assistant"
version = "0.1.0"
description = "Convert Halo Waypoint Chronicles into polished EPUB books."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "The Haruspis Assistant contributors"}]
dependencies = []

[project.scripts]
haruspis-assistant = "librarian_assistant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

